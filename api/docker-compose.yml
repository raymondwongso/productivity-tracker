# Own compose project: without `name`, Compose would call this project "api" (the folder name),
# and any other stack in a folder called api/ would share its containers and the pgdata volume.
name: productivity-tracker

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: productivity_tracker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productivity_tracker"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/productivity_tracker
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      PORT: 3002
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:-}  # required (32+ chars): the api container exits at startup without it
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3003}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/productivity_tracker
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
